name: lbsTestBuild
run-name: LBSTestBuild
on: [push]
jobs:
  LBSTestBuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install dependencies
        run: npm install
        
      - name: run linter
        run: npm run lint
      
      - name: run build
        run: npm run build
      